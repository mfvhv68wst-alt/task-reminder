<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#f5f5f5;font-family:Arial,sans-serif;min-height:100vh;padding:24px}
.app-header,.add-form,.reminder-list{width:100%;max-width:600px;margin-left:auto;margin-right:auto}
.app-header{margin-bottom:32px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.greeting{color:#888;font-size:14px;margin-bottom:5px}
h1{font-size:32px;line-height:1}
.date{color:#888;font-size:14px;margin-top:8px}
.add-button{border:0;background:transparent;color:#fff;font-size:32px;line-height:1;padding:0;cursor:pointer}
.add-form{display:none;margin-bottom:32px;padding:20px;background:#181818;border:1px dashed #444;border-radius:20px}
.add-form h2{margin-bottom:20px;font-size:20px}
.add-form label{display:block;margin-bottom:16px;color:#aaa;font-size:13px}
.add-form input,.add-form select{width:100%;margin-top:7px;padding:12px;border-radius:10px;border:1px solid #383838;background:#111;color:#fff;font-size:14px}
.date-time-row{display:flex;align-items:flex-start;gap:10px}
.date-time-row label{flex:0 0 44%;min-width:0}
.date-time-row label+label{flex-basis:44%}
.add-form input[type=date]::-webkit-calendar-picker-indicator,.add-form input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
.subtask-form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.subtask-form-header span{color:#aaa;font-size:13px}
#add-subtask{border:0;background:transparent;color:#fff;font-size:13px;padding:4px 0;cursor:pointer}
.subtask-input-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.subtask-input-row input{flex:1;margin-top:0}
.remove-subtask{border:0;background:transparent;color:#888;font-size:20px;cursor:pointer;padding:0 4px}
#save-reminder{width:100%;padding:13px;border:1px solid #fff;border-radius:12px;background:transparent;color:#fff;font-size:15px;cursor:pointer}
#save-reminder:hover{background:#fff;color:#111}
.priority-section{margin-bottom:30px}
.priority-section h2,.completed-section h2{font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.reminder-card{background:#1b1b1b;border:1px solid #303030;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-top>div{min-width:0}
.card-top h3{font-size:15px;margin-bottom:4px;overflow-wrap:anywhere}
.card-top p{color:#888;font-size:12px}
.priority-dot{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:#ff5c5c}
.medium .priority-dot{background:#ffd166}.low .priority-dot{background:#6dd5ed}
.subtasks{margin-top:18px;padding-top:15px;border-top:1px dashed #333}
.subtasks label{display:block;color:#ccc;font-size:14px;margin-bottom:11px;cursor:pointer}
.subtasks input{margin-right:8px}
.progress{margin-top:15px;color:#777;font-size:12px}
.task-status{display:inline-block;margin-top:8px;font-size:12px;color:#888;vertical-align:middle}
.task-status.completed{color:#7ee787;font-weight:bold}
.task-action{display:inline-block;margin-top:8px;margin-left:8px;vertical-align:middle}
.done-button{padding:5px 10px;border:1px solid #444;border-radius:8px;background:transparent;color:#aaa;font-size:11px;cursor:pointer}
.done-button:hover{background:#fff;color:#111}
.completed-section{margin-top:8px;padding-top:8px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#7c6cff;color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:bold;opacity:0;pointer-events:none;transition:all .3s ease;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notification-note{
  margin-top:10px;
  color:#777;
  font-size:11px;
  line-height:1.4;
}

@media(max-width:480px){body{padding:18px}.app-header{margin-bottom:24px}.add-form{padding:16px;border-radius:16px}.date-time-row{gap:8px}.date-time-row label{flex-basis:43%}.date-time-row label+label{flex-basis:43%}}
</style>
</head>
<body>
<header class="app-header">
  <div>
    <p class="greeting">Good morning!</p>
    <h1>Reminders</h1>
    <p class="date">Monday, August 10</p>
  </div>
  <button class="add-button" type="button" aria-label="Add reminder">+</button>
</header>

<div class="add-form">
  <h2>New Reminder</h2>
  <label>Title
    <input type="text" id="reminder-title" placeholder="What do you need to do?">
  </label>

  <div class="date-time-row">
    <label>Date
      <input type="date" id="reminder-date">
    </label>
    <label>Time
      <input type="time" id="reminder-time">
    </label>
  </div>

  <label>Priority
    <select id="reminder-priority">
      <option value="important">Important</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>

  <label>Repeat
    <select id="reminder-repeat">
      <option value="none">Doesn't repeat</option>
      <option value="weekly">Every week</option>
      <option value="monthly">Every month</option>
    </select>
  </label>

  <div class="subtask-form">
    <div class="subtask-form-header">
      <span>Subtasks</span>
      <button type="button" id="add-subtask">+ Add</button>
    </div>
    <div id="subtask-inputs"></div>
  </div>

  <button id="save-reminder" type="button">Save Reminder</button>
</div>

<main class="reminder-list">
  <section class="priority-section important"><h2>Important</h2></section>
  <section class="priority-section medium"><h2>Medium</h2></section>
  <section class="priority-section low"><h2>Low</h2></section>
  <section class="completed-section">
    <h2>Completed</h2>
    <div id="completed-list"></div>
  </section>
</main>

<div id="toast" class="toast">✓ Reminder saved</div>

<script>
const STORAGE_KEY="reminders_app_data";

function getReminders(){
  const data=localStorage.getItem(STORAGE_KEY);
  if(!data)return [];
  try{return JSON.parse(data)}catch(e){return []}
}

function saveReminders(reminders){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(reminders));
}

function showToast(message="✓ Reminder saved"){
  const toast=document.getElementById("toast");
  if(toast)toast.textContent=message;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}

function moveCard(card,reminder){
  if(reminder.completed){
    const list=document.getElementById("completed-list");
    if(list)list.appendChild(card);
    return;
  }
  const section=document.querySelector(`.priority-section.${reminder.priority}`);
  if(section)section.appendChild(card);
}

function addDoneButton(card,reminder){
  const button=document.createElement("button");
  button.className="done-button";
  const status=card.querySelector(".task-status");

  function update(){
    if(reminder.completed){
      status.textContent="Completed";
      status.classList.add("completed");
      button.textContent="↶ Undo";
    }else{
      status.textContent="Not completed";
      status.classList.remove("completed");
      button.textContent="✓ Done";
    }
  }

  update();

  button.addEventListener("click",function(){
    const reminders=getReminders();
    const current=reminders.find(item=>item.id===reminder.id);
    if(!current)return;
    current.completed=!current.completed;
    if(current.completed){
      current.nextNotificationAt = null;
    }else{
      current.nextNotificationAt = Date.now();
    }
    saveReminders(reminders);
    reminder.completed=current.completed;
    reminder.nextNotificationAt=current.nextNotificationAt;
    update();
    moveCard(card,reminder);
  });

  card.querySelector(".task-action").appendChild(button);
}

function createReminderCard(reminder){
  const card=document.createElement("div");
  card.className="reminder-card";
  card.dataset.reminderId=reminder.id;

  const subtasks=Array.isArray(reminder.subtasks)?reminder.subtasks:[];
  const saved=Array.isArray(reminder.subtaskCompleted)?reminder.subtaskCompleted:[];
  let subtasksHTML="";
  let completedCount=0;

  subtasks.forEach((subtask,index)=>{
    const checked=saved[index]===true;
    if(checked)completedCount++;
    subtasksHTML+=`<label><input type="checkbox" ${checked?"checked":""}>${subtask}</label>`;
  });

  const total=subtasks.length;
  const progressHTML=total>0?`<div class="progress">${completedCount} / ${total} completed</div>`:"";
  let statusText=reminder.completed?"Completed":"Not completed";
  let statusClass=reminder.completed?"completed":"";

  if(total>0&&completedCount===total){
    reminder.completed=true;
    statusText="Completed";
    statusClass="completed";
  }

  card.innerHTML=`
    <div class="card-top">
      <div>
        <h3>${reminder.title}</h3>
        <p>${reminder.date} · ${reminder.time}</p>
      </div>
      <span class="priority-dot"></span>
    </div>
    ${total>0?`<div class="subtasks">${subtasksHTML}</div>`:""}
    ${progressHTML}
    <div class="task-status ${statusClass}">${statusText}</div>
    <div class="task-action"></div>
  `;

  if(total===0)addDoneButton(card,reminder);
  return card;
}

function loadReminders(){
  getReminders().forEach(reminder=>{
    const card=createReminderCard(reminder);
    moveCard(card,reminder);
  });
}


const NOTIFICATION_INTERVAL_MS = 10 * 60 * 1000;
const NOTIFICATION_CHECK_MS = 30 * 1000;

function reminderDueAt(reminder){
  if(!reminder.date || !reminder.time)return null;
  const value = new Date(`${reminder.date}T${reminder.time}`);
  if(Number.isNaN(value.getTime()))return null;
  return value.getTime();
}

function requestNotificationPermission(){
  if(!('Notification' in window)){
    return Promise.resolve('unsupported');
  }

  if(Notification.permission === 'granted'){
    return Promise.resolve('granted');
  }

  if(Notification.permission === 'denied'){
    return Promise.resolve('denied');
  }

  return Notification.requestPermission();
}

function notifyReminder(reminder){
  const message = reminder.subtasks && reminder.subtasks.length
    ? `${reminder.title} masih belum selesai.`
    : `${reminder.title} masih belum selesai.`;

  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('Reminder', {
        body: message,
        tag: `reminder-${reminder.id}`,
        renotify: true
      });
      return;
    }catch(error){
      // Fall back to the in-app toast below.
    }
  }

  showToast(`Reminder: ${reminder.title} belum selesai`);
}

function scheduleReminderNotification(reminder, now){
  if(reminder.completed)return;

  const dueAt = reminderDueAt(reminder);
  if(dueAt === null)return;
  if(now < dueAt)return;

  const nextNotificationAt = Number(reminder.nextNotificationAt || 0);

  if(nextNotificationAt > now)return;

  notifyReminder(reminder);

  reminder.nextNotificationAt = now + NOTIFICATION_INTERVAL_MS;
}

function checkReminderNotifications(){
  const reminders = getReminders();
  const now = Date.now();
  let changed = false;

  reminders.forEach(reminder=>{
    const before = reminder.nextNotificationAt;
    scheduleReminderNotification(reminder, now);
    if(reminder.nextNotificationAt !== before)changed = true;
  });

  if(changed)saveReminders(reminders);
}

function startNotificationScheduler(){
  checkReminderNotifications();
  setInterval(checkReminderNotifications, NOTIFICATION_CHECK_MS);
}

function setupSubtaskInputs(){
  const addButton=document.getElementById("add-subtask");
  const container=document.getElementById("subtask-inputs");
  if(!addButton||!container)return;

  addButton.addEventListener("click",function(){
    const row=document.createElement("div");
    row.className="subtask-input-row";
    row.innerHTML=`
      <input type="text" class="new-subtask" placeholder="Enter subtask...">
      <button type="button" class="remove-subtask">×</button>
    `;
    container.appendChild(row);
    row.querySelector(".remove-subtask").addEventListener("click",()=>row.remove());
  });
}

document.addEventListener("change",function(event){
  if(!event.target.matches(".reminder-card .subtasks input[type='checkbox']"))return;

  const card=event.target.closest(".reminder-card");
  if(!card)return;

  const checkboxes=card.querySelectorAll(".subtasks input[type='checkbox']");
  const progress=card.querySelector(".progress");
  const status=card.querySelector(".task-status");
  let completed=0;

  checkboxes.forEach(checkbox=>{if(checkbox.checked)completed++});
  const total=checkboxes.length;

  if(progress)progress.textContent=`${completed} / ${total} completed`;

  const isCompleted=total>0&&completed===total;
  if(status){
    status.textContent=isCompleted?"Completed":"Not completed";
    status.classList.toggle("completed",isCompleted);
  }

  const reminders=getReminders();
  const reminder=reminders.find(item=>item.id===Number(card.dataset.reminderId));
  if(!reminder)return;

  reminder.subtaskCompleted=[];
  checkboxes.forEach(checkbox=>reminder.subtaskCompleted.push(checkbox.checked));
  reminder.completed=isCompleted;
  if(isCompleted){
    reminder.nextNotificationAt = null;
  }else if(reminderDueAt(reminder) !== null && Date.now() >= reminderDueAt(reminder)){
    reminder.nextNotificationAt = Date.now();
  }
  saveReminders(reminders);
  moveCard(card,reminder);
});

document.addEventListener("DOMContentLoaded",function(){
  const addButton=document.querySelector(".add-button");
  const addForm=document.querySelector(".add-form");
  const saveButton=document.getElementById("save-reminder");
  const subtaskContainer=document.getElementById("subtask-inputs");

  if(addButton&&addForm){
    addButton.addEventListener("click",()=>{
      addForm.style.display="block";
      requestNotificationPermission();
    });
  }

  setupSubtaskInputs();

  if(saveButton){
    saveButton.addEventListener("click",function(){
      const title=document.getElementById("reminder-title").value.trim();
      const date=document.getElementById("reminder-date").value;
      const time=document.getElementById("reminder-time").value;
      const priority=document.getElementById("reminder-priority").value;
      const repeat=document.getElementById("reminder-repeat").value;

      if(title===""){
        alert("Please enter a reminder title.");
        return;
      }

      const section=document.querySelector(`.priority-section.${priority}`);
      if(!section){
        alert("Priority section not found.");
        return;
      }

      const subtaskList=[];
      document.querySelectorAll(".new-subtask").forEach(input=>{
        const text=input.value.trim();
        if(text!=="")subtaskList.push(text);
      });

      const reminder={
        id:Date.now(),
        title,
        date,
        time,
        priority,
        repeat,
        subtasks:subtaskList,
        completed:false,
        nextNotificationAt:null
      };

      requestNotificationPermission();

      const dueAt = reminderDueAt(reminder);
      if(dueAt !== null && dueAt <= Date.now()){
        reminder.nextNotificationAt = Date.now();
      }

      const reminders=getReminders();
      reminders.push(reminder);
      saveReminders(reminders);

      section.appendChild(createReminderCard(reminder));

      document.getElementById("reminder-title").value="";
      document.getElementById("reminder-date").value="";
      document.getElementById("reminder-time").value="";
      if(subtaskContainer)subtaskContainer.innerHTML="";
      if(addForm)addForm.style.display="none";
      showToast();
    });
  }

  loadReminders();
  startNotificationScheduler();
});


/* =========================================
   REMINDER NOTIFICATIONS
   ========================================= */

const NOTIFICATION_STATE_KEY =
  "reminder_notification_state";

const DEFAULT_REPEAT_MINUTES = 10;
const SNOOZE_MINUTES = 60;


function getNotificationState() {

  const data =
    localStorage.getItem(
      NOTIFICATION_STATE_KEY
    );

  if (!data) {
    return {};
  }

  try {
    return JSON.parse(data);
  } catch (error) {
    return {};
  }
}


function saveNotificationState(state) {

  localStorage.setItem(
    NOTIFICATION_STATE_KEY,
    JSON.stringify(state)
  );

}


function getReminderNotificationState(
  reminderId
) {

  const state =
    getNotificationState();

  return (
    state[reminderId] || {
      nextNotificationAt: null,
      snoozedUntil: null
    }
  );

}


function setReminderNotificationState(
  reminderId,
  value
) {

  const state =
    getNotificationState();

  state[reminderId] = value;

  saveNotificationState(state);

}


function showReminderNotification(
  reminder
) {

  if (reminder.completed) {
    return;
  }

  if (!reminder.date || !reminder.time) {
    return;
  }

  const now =
    Date.now();

  const reminderTime =
    new Date(
      `${reminder.date}T${reminder.time}`
    ).getTime();

  if (Number.isNaN(reminderTime)) {
    return;
  }

  if (now < reminderTime) {
    return;
  }


  const notificationState =
    getReminderNotificationState(
      reminder.id
    );


  if (
    notificationState.snoozedUntil &&
    now <
      notificationState.snoozedUntil
  ) {
    return;
  }


  if (
    notificationState.nextNotificationAt &&
    now <
      notificationState.nextNotificationAt
  ) {
    return;
  }


  const message =
    `${reminder.title} — ${reminder.time}`;


  /*
   * Browser notification
   */
  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {

    const notification =
      new Notification(
        "Reminder",
        {
          body: message,
          tag:
            `reminder-${reminder.id}`
        }
      );


    /*
     * When the user clicks the browser
     * notification, open the app again.
     */
    notification.onclick =
      function () {
        window.focus();
        notification.close();
      };

  } else {

    /*
     * Fallback for browsers that do not
     * currently grant browser notifications.
     */
    showToast(message);

  }


  /*
   * Default behavior:
   * if there is no response,
   * repeat every 10 minutes.
   */
  setReminderNotificationState(
    reminder.id,
    {
      nextNotificationAt:
        now +
        DEFAULT_REPEAT_MINUTES *
          60 *
          1000,

      snoozedUntil: null
    }
  );

}


async function requestNotificationPermission() {

  if (
    "Notification" in window &&
    Notification.permission === "default"
  ) {

    try {

      await Notification.requestPermission();

    } catch (error) {

      // Ignore permission errors.

    }

  }

}


function checkReminderNotifications() {

  const reminders =
    getReminders();

  reminders.forEach(
    function (reminder) {

      showReminderNotification(
        reminder
      );

    }
  );

}


/*
 * User chose "Belum".
 * Next notification = 1 hour later.
 */
function snoozeReminderForOneHour(
  reminderId
) {

  const now =
    Date.now();

  setReminderNotificationState(
    reminderId,
    {
      nextNotificationAt:
        now +
        SNOOZE_MINUTES *
          60 *
          1000,

      snoozedUntil:
        now +
        SNOOZE_MINUTES *
          60 *
          1000
    }
  );

}


/*
 * User completed the reminder.
 * Notification state is cleared.
 */
function stopReminderNotifications(
  reminderId
) {

  const state =
    getNotificationState();

  delete state[reminderId];

  saveNotificationState(state);

}


/*
 * A notification action popup inside
 * the app. The browser Notification API
 * itself only carries the message, so
 * the app provides the response buttons.
 */
function showReminderResponsePopup(
  reminder
) {

  const existing =
    document.getElementById(
      "reminder-response-popup"
    );

  if (existing) {
    existing.remove();
  }


  const popup =
    document.createElement("div");

  popup.id =
    "reminder-response-popup";


  popup.innerHTML = `
    <div class="reminder-response-box">

      <div class="reminder-response-title">
        Reminder
      </div>

      <div class="reminder-response-message">
        ${reminder.title}
      </div>

      <div class="reminder-response-actions">

        <button
          type="button"
          id="reminder-response-done"
        >
          Done
        </button>

        <button
          type="button"
          id="reminder-response-later"
        >
          Belum
        </button>

      </div>

    </div>
  `;


  document.body.appendChild(
    popup
  );


  document
    .getElementById(
      "reminder-response-done"
    )
    .addEventListener(
      "click",
      function () {

        const reminders =
          getReminders();

        const currentReminder =
          reminders.find(
            function (item) {
              return (
                item.id ===
                reminder.id
              );
            }
          );


        if (currentReminder) {

          currentReminder.completed =
            true;

          saveReminders(
            reminders
          );

          stopReminderNotifications(
            reminder.id
          );

        }


        popup.remove();

        window.location.reload();

      }
    );


  document
    .getElementById(
      "reminder-response-later"
    )
    .addEventListener(
      "click",
      function () {

        snoozeReminderForOneHour(
          reminder.id
        );

        popup.remove();

      }
    );

}


/*
 * Keep checking every 30 seconds so that
 * the 10-minute / 1-hour schedule does not
 * depend on the exact timing of the page.
 */
setInterval(
  checkReminderNotifications,
  30 * 1000
);


/*
 * Ask for notification permission and
 * check immediately on page load.
 */
requestNotificationPermission();
checkReminderNotifications();

</script>
</body>
</html>
