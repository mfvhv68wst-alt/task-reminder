<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reminders</title>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #111111;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 24px;
}

.app-header {
  max-width: 600px;
  margin: 0 auto 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.greeting {
  color: #888888;
  font-size: 14px;
  margin-bottom: 5px;
}

h1 {
  font-size: 32px;
  line-height: 1;
}

.date {
  color: #888888;
  font-size: 14px;
  margin-top: 8px;
}

.add-button {
  width: 52px;
  height: 52px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  background: transparent;
  color: #ffffff;
  font-size: 30px;
  cursor: pointer;
}

.reminder-list {
  max-width: 600px;
  margin: 0 auto;
}

.priority-section {
  margin-bottom: 30px;
}

.priority-section h2 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.reminder-card {
  background: #1b1b1b;
  border: 1px solid #303030;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.card-top h3 {
  font-size: 18px;
  margin-bottom: 6px;
}

.card-top p {
  color: #888888;
  font-size: 13px;
}

.priority-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff5c5c;
  display: block;
}

.medium .priority-dot {
  background: #ffd166;
}

.low .priority-dot {
  background: #6dd5ed;
}

.subtasks {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px dashed #333333;
}

.subtasks label {
  display: block;
  color: #cccccc;
  font-size: 14px;
  margin-bottom: 11px;
  cursor: pointer;
}

.subtasks input {
  margin-right: 8px;
}

.progress {
  margin-top: 15px;
  color: #777777;
  font-size: 12px;
}
.task-status {
  margin-top: 8px;
  font-size: 13px;
  color: #888888;
}

.task-status.completed {
  color: #7ee787;
  font-weight: bold;
}

.add-form {
  max-width: 600px;
  margin: 0 auto 32px;
  padding: 20px;
  background: #181818;
  border: 1px dashed #444444;
  border-radius: 20px;
}

.add-form h2 {
  margin-bottom: 20px;
  font-size: 20px;
}

.add-form label {
  display: block;
  margin-bottom: 16px;
  color: #aaaaaa;
  font-size: 13px;
}

.add-form input,
.add-form select {
  width: 100%;
  margin-top: 7px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #383838;
  background: #111111;
  color: #ffffff;
  font-size: 14px;
}

#save-reminder {
  width: 100%;
  padding: 13px;
  border: 1px solid #ffffff;
  border-radius: 12px;
  background: transparent;
  color: #ffffff;
  font-size: 15px;
  cursor: pointer;
}

#save-reminder:hover {
  background: #ffffff;
  color: #111111;
}

.add-form input[type="date"]::-webkit-calendar-picker-indicator,
.add-form input[type="time"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
  cursor: pointer;
}

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);

  background: #7c6cff;
  color: #ffffff;

  padding: 12px 20px;
  border-radius: 14px;

  font-size: 14px;
  font-weight: bold;

  opacity: 0;
  pointer-events: none;

  transition: 0.3s ease;

  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#toast {
  position: fixed;

  bottom: 30px;
  left: 50%;

  transform: translateX(-50%) translateY(20px);

  background: #7c6cff;
  color: #ffffff;

  padding: 12px 20px;

  border-radius: 14px;

  font-size: 14px;
  font-weight: bold;

  opacity: 0;

  pointer-events: none;

  transition: all 0.3s ease;

  z-index: 9999;
}

#toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* Responsive layout polish */
html {
  background: #111111;
}

body {
  width: 100%;
  overflow-x: hidden;
}

.app-header,
.add-form,
.reminder-list {
  width: 100%;
  max-width: 600px;
}

.app-header {
  margin: 0 auto 24px;
}

.add-form {
  margin: 0 auto 32px;
}

@media (max-width: 640px) {
  body {
    padding: 20px 16px 32px;
  }

  .app-header {
    margin-bottom: 24px;
  }

  h1 {
    font-size: 30px;
  }

  .add-button {
    width: 48px;
    height: 48px;
    font-size: 28px;
    flex: 0 0 auto;
  }

  .add-form {
    padding: 18px;
    border-radius: 18px;
  }

  .reminder-card {
    padding: 16px;
    border-radius: 18px;
  }
}


.add-form {
  display: none;
  position: relative;
}

.add-form.open {
  display: block;
}

.close-form {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border: 1px solid #444444;
  border-radius: 50%;
  background: transparent;
  color: #ffffff;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.close-form:hover {
  background: #ffffff;
  color: #111111;
}


.add-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
  text-align: center;
}


.data-tools {
  width: 100%;
  max-width: 600px;
  margin: 8px auto 0;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.data-tools button {
  flex: 1 1 0;
  min-width: 90px;
  padding: 11px 14px;
  border: 1px solid #383838;
  border-radius: 12px;
  background: #181818;
  color: #ffffff;
  font-size: 14px;
  cursor: pointer;
}

.data-tools button:hover {
  background: #ffffff;
  color: #111111;
}

@media (max-width: 640px) {
  .data-tools {
    gap: 8px;
  }

  .data-tools button {
    min-width: 0;
  }
}


.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.settings-button {
  width: 44px;
  height: 44px;
  border: 1px solid #383838;
  border-radius: 50%;
  background: transparent;
  color: #ffffff;
  font-size: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
}

.settings-button:hover {
  background: #ffffff;
  color: #111111;
}

.data-tools {
  display: none;
  margin-top: 12px;
}

.data-tools.open {
  display: flex;
}

.settings-panel {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 24px;
  padding: 18px;
  background: #181818;
  border: 1px solid #303030;
  border-radius: 18px;
  display: none;
}

.settings-panel.open {
  display: block;
}

.settings-panel h2 {
  font-size: 18px;
  margin-bottom: 6px;
}

.settings-panel p {
  color: #888888;
  font-size: 13px;
  margin-bottom: 14px;
}

@media (max-width: 640px) {
  .header-actions {
    gap: 8px;
  }

  .settings-button {
    width: 42px;
    height: 42px;
  }
}

</style>
</head>

<body>

  <header class="app-header">

    <div>
      <p class="greeting">Good morning!</p>

      <h1>Reminders</h1>

      <p class="date">Monday, August 10</p>
    </div>

    <div class="header-actions">
      <button class="settings-button" id="settings-button" aria-label="Settings">
        ⚙
      </button>

      <button class="add-button" aria-label="Add reminder">
        +
      </button>
    </div>
  </header>



<div class="add-form" id="add-form">

  <button type="button" class="close-form" id="close-form" aria-label="Close">×</button>

  <h2>New Reminder</h2>

  <label>
    Title
    <input type="text" id="reminder-title" placeholder="What do you need to do?">
  </label>

  <label>
    Date
    <input type="date" id="reminder-date">
  </label>

  <label>
    Time
    <input type="time" id="reminder-time">
  </label>

  <label>
    Priority
    <select id="reminder-priority">
      <option value="important">Important</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>

  <label>
    Repeat
    <select id="reminder-repeat">
      <option value="none">Doesn't repeat</option>
      <option value="weekly">Every week</option>
      <option value="monthly">Every month</option>
    </select>
  </label>

  <div class="subtask-form">

  <div class="subtask-form-header">
    <span>Subtasks</span>

    <button
      type="button"
      id="add-subtask"
    >
      + Add
    </button>
  </div>

  <div id="subtask-inputs"></div>

</div>

  <button id="save-reminder">
    Save Reminder
  </button>

</div>

  


  <main class="reminder-list">


    <!-- IMPORTANT -->

    <section class="priority-section important">
      <h2>Important</h2>
    </section>


    <!-- MEDIUM -->

    <section class="priority-section medium">
      <h2>Medium</h2>
    </section>


    <!-- LOW -->

    <section class="priority-section low">
      <h2>Low</h2>
    </section>


  
<section class="settings-panel" id="settings-panel" aria-label="Settings">
  <h2>Settings</h2>
  <p>Manage your reminder data.</p>

  <div class="data-tools" aria-label="Data tools">
    <button type="button" id="backup-reminders">Backup</button>
    <button type="button" id="restore-reminders">Restore</button>
    <button type="button" id="reset-reminders">Reset</button>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
  </div>
</section>

</main>
<script>
const STORAGE_KEY = "reminders_app_data";

function getReminders() {
  const data = localStorage.getItem(STORAGE_KEY);

  if (!data) {
    return [];
  }

  return JSON.parse(data);
}


function saveReminders(reminders) {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(reminders)
  );
}


  document.addEventListener("DOMContentLoaded", function () {

  // =========================
  // FRESH START ONCE
  // =========================

  const FRESH_START_KEY = "reminders_fresh_start_v1";

  if (!localStorage.getItem(FRESH_START_KEY)) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.setItem(FRESH_START_KEY, "done");
  }



  // =========================
  // SUBTASK PROGRESS
  // =========================

  const checkboxes = document.querySelectorAll(
    ".subtasks input[type='checkbox']"
  );

  const progress = document.querySelector(".progress");
  const taskStatus = document.querySelector(".task-status");


  function updateProgress() {

    const total = checkboxes.length;

    let completed = 0;

    checkboxes.forEach(function (checkbox) {

      if (checkbox.checked) {
        completed++;
      }

    });


    progress.textContent =
      `${completed} / ${total} completed`;


    if (completed === total) {

      taskStatus.textContent = "Completed";

      taskStatus.classList.add("completed");

    } else {

      taskStatus.textContent = "Not completed";

      taskStatus.classList.remove("completed");

    }

  }


  checkboxes.forEach(function (checkbox) {

    checkbox.addEventListener(
      "change",
      updateProgress
    );

  });


  updateProgress();



  // =========================
  // SAVE REMINDER
  // =========================

  const saveReminderButton =
    document.getElementById("save-reminder");


  saveReminderButton.addEventListener(
    "click",
    function () {

      const title =
        document.getElementById("reminder-title").value.trim();

      const date =
        document.getElementById("reminder-date").value;

      const time =
        document.getElementById("reminder-time").value;

      const priority =
        document.getElementById("reminder-priority").value;

      const repeat =
        document.getElementById("reminder-repeat").value;


      // Title wajib diisi

      if (title === "") {

        alert("Please enter a reminder title.");

        return;

      }


      // Cari bagian priority

      const section =
        document.querySelector(
          `.priority-section.${priority}`
        );


      // Kalau section tidak ditemukan

      if (!section) {

        alert("Priority section not found.");

        return;

      }


      // Buat kartu baru

      const newCard = document.createElement("div");

newCard.className = "reminder-card";

const reminderId = Date.now();

newCard.dataset.reminderId = reminderId;




// Ambil semua subtask dari form
const subtaskElements =
  document.querySelectorAll(".new-subtask");

const subtaskList = [];

subtaskElements.forEach(function (input) {

  const text = input.value.trim();

  if (text !== "") {
    subtaskList.push(text);
  }

});


// Buat HTML subtask
let subtasksHTML = "";

subtaskList.forEach(function (subtask) {

  subtasksHTML += `
    <label>
      <input type="checkbox">
      ${subtask}
    </label>
  `;

});


// Buat kartu reminder
newCard.innerHTML = `

  <div class="card-top">

    <div>
      <h3>${title}</h3>
      <p>${date} · ${time}</p>
    </div>

    <span class="priority-dot"></span>

  </div>


  <div class="subtasks">

    ${subtasksHTML}

 <div class="progress">
  ${
    subtaskList.length > 0
      ? `0 / ${subtaskList.length} completed`
      : ""
  }
</div>

<div class="task-status">
  Not completed
</div>

<div class="task-action"></div>


 
`;
if (subtaskList.length === 0) {

  const doneButton = document.createElement("button");

  doneButton.className = "done-button";

  doneButton.textContent = "✓ Done";

  const taskStatus =
    newCard.querySelector(".task-status");

  doneButton.addEventListener("click", function () {

    taskStatus.textContent = "Completed";

    taskStatus.classList.add("completed");

    doneButton.textContent = "↶ Undo";

    doneButton.classList.add("undo");

    doneButton.onclick = function () {

      taskStatus.textContent = "Not completed";

      taskStatus.classList.remove("completed");

      doneButton.textContent = "✓ Done";

      doneButton.classList.remove("undo");

    };

  });

  newCard
    .querySelector(".task-action")
    .appendChild(doneButton);
}

      // Masukkan kartu ke priority section

      section.appendChild(newCard);

      const reminders = getReminders();

reminders.push({
  id: reminderId,
  title: title,
  date: date,
  time: time,
  priority: priority,
  repeat: repeat,
  subtasks: subtaskList,
  completed: false
});

saveReminders(reminders);


      // Kosongkan form

      document.getElementById(
        "reminder-title"
      ).value = "";

      document.getElementById(
        "reminder-date"
      ).value = "";

      document.getElementById(
        "reminder-time"
      ).value = "";
const subtaskInputs =
  document.getElementById("subtask-inputs");

subtaskInputs.innerHTML = "";

      console.log(
        "Reminder created:",
        {
          title,
          date,
          time,
          priority,
          repeat
        }
      );


const toast = document.getElementById("toast");

toast.classList.add("show");

      if (addForm) {
        addForm.classList.remove("open");
      }

setTimeout(function () {
  toast.classList.remove("show");
}, 2000);
    }
  );

});

const addSubtaskButton =
  document.getElementById("add-subtask");

const subtaskInputs =
  document.getElementById("subtask-inputs");


addSubtaskButton.addEventListener(
  "click",
  function () {

    const subtaskRow =
      document.createElement("div");

    subtaskRow.className =
      "subtask-input-row";


    subtaskRow.innerHTML = `
      <input
        type="text"
        class="new-subtask"
        placeholder="Enter subtask..."
      >

      <button
        type="button"
        class="remove-subtask"
      >
        ×
      </button>
    `;


    subtaskInputs.appendChild(
      subtaskRow
    );


    const removeButton =
      subtaskRow.querySelector(
        ".remove-subtask"
      );


    removeButton.addEventListener(
      "click",
      function () {

        subtaskRow.remove();

      }
    );

  }
);

document.addEventListener("change", function (event) {

  if (
    event.target.matches(
      ".reminder-card .subtasks input[type='checkbox']"
    )
  ) {

    const card =
      event.target.closest(".reminder-card");

    const checkboxes =
      card.querySelectorAll(
        ".subtasks input[type='checkbox']"
      );

    const progress =
      card.querySelector(".progress");

    const taskStatus =
      card.querySelector(".task-status");

    let completed = 0;

    checkboxes.forEach(function (checkbox) {

      if (checkbox.checked) {
        completed++;
      }

    });

    const total = checkboxes.length;

    progress.textContent =
      `${completed} / ${total} completed`;

    if (completed === total && total > 0) {

      taskStatus.textContent = "Completed";

      taskStatus.classList.add("completed");

    } else {

      taskStatus.textContent = "Not completed";

      taskStatus.classList.remove("completed");

    }
const reminders = getReminders();

const reminderId =
  Number(card.dataset.reminderId);

const reminder = reminders.find(function (item) {
  return item.id === reminderId;
});

if (reminder) {

  reminder.subtaskCompleted = [];

  checkboxes.forEach(function (checkbox) {

    reminder.subtaskCompleted.push(
      checkbox.checked
    );

  });

  reminder.completed =
    completed === total && total > 0;

  saveReminders(reminders);
}
  }

});

function loadReminders() {

  const reminders = getReminders();

  reminders.forEach(function (reminder) {

    const section = document.querySelector(
      `.priority-section.${reminder.priority}`
    );

    if (!section) {
      return;
    }


    // =========================
    // CREATE CARD
    // =========================

    const newCard = document.createElement("div");

    newCard.className = "reminder-card";

    newCard.dataset.reminderId = reminder.id;


    // =========================
    // SUBTASKS
    // =========================

    let subtasksHTML = "";

    let completedCount = 0;

    const savedSubtasks =
      reminder.subtaskCompleted || [];


    reminder.subtasks.forEach(
      function (subtask, index) {

        const isChecked =
          savedSubtasks[index] === true;

        if (isChecked) {
          completedCount++;
        }


        subtasksHTML += `
          <label>

            <input
              type="checkbox"
              ${isChecked ? "checked" : ""}
            >

            ${subtask}

          </label>
        `;

      }
    );


    const totalSubtasks =
      reminder.subtasks.length;


    // =========================
    // STATUS
    // =========================

    let statusText = "Not completed";

    let statusClass = "";


    if (
      totalSubtasks > 0 &&
      completedCount === totalSubtasks
    ) {

      statusText = "Completed";

      statusClass = "completed";

    }


    // =========================
    // PROGRESS
    // =========================

    let progressHTML = "";

    if (totalSubtasks > 0) {

      progressHTML = `
        <div class="progress">
          ${completedCount} / ${totalSubtasks} completed
        </div>
      `;

    }


    // =========================
    // CARD HTML
    // =========================

    newCard.innerHTML = `

      <div class="card-top">

        <div>

          <h3>${reminder.title}</h3>

          <p>
            ${reminder.date} · ${reminder.time}
          </p>

        </div>

        <span class="priority-dot"></span>

      </div>


      ${
        totalSubtasks > 0
          ? `
            <div class="subtasks">
              ${subtasksHTML}
            </div>
          `
          : ""
      }


      ${progressHTML}


      <div class="task-status ${statusClass}">
        ${statusText}
      </div>


      <div class="task-action"></div>

    `;


    // =========================
    // TASK WITHOUT SUBTASK
    // =========================

    if (totalSubtasks === 0) {

      const doneButton =
        document.createElement("button");

      doneButton.className =
        "done-button";


      if (reminder.completed) {

        doneButton.textContent =
          "↶ Undo";

      } else {

        doneButton.textContent =
          "✓ Done";

      }


      const taskStatus =
        newCard.querySelector(".task-status");


      if (reminder.completed) {

        taskStatus.textContent =
          "Completed";

        taskStatus.classList.add(
          "completed"
        );

      }


      doneButton.addEventListener(
        "click",
        function () {

          const reminders =
            getReminders();

          const currentReminder =
            reminders.find(function (item) {

              return item.id === reminder.id;

            });


          if (!currentReminder) {
            return;
          }


          currentReminder.completed =
            !currentReminder.completed;


          saveReminders(reminders);


          if (currentReminder.completed) {

            taskStatus.textContent =
              "Completed";

            taskStatus.classList.add(
              "completed"
            );

            doneButton.textContent =
              "↶ Undo";

          } else {

            taskStatus.textContent =
              "Not completed";

            taskStatus.classList.remove(
              "completed"
            );

            doneButton.textContent =
              "✓ Done";

          }

        }
      );


      newCard
        .querySelector(".task-action")
        .appendChild(doneButton);

    }


    // =========================
    // ADD CARD TO PAGE
    // =========================

    section.appendChild(newCard);

  });

}
  // =========================
  // NEW REMINDER FORM TOGGLE
  // =========================

  const addButton = document.querySelector(".add-button");
  const addForm = document.getElementById("add-form");
  const closeFormButton = document.getElementById("close-form");

  if (addButton && addForm) {
    addButton.addEventListener("click", function () {
      addForm.classList.add("open");
      addForm.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });
  }

  if (closeFormButton && addForm) {
    closeFormButton.addEventListener("click", function () {
      addForm.classList.remove("open");
    });
  }





  // =========================
  // SETTINGS MENU
  // =========================

  const settingsButton =
    document.getElementById("settings-button");

  const settingsPanel =
    document.getElementById("settings-panel");

  const dataTools =
    document.querySelector(".data-tools");

  if (settingsButton && settingsPanel) {

    settingsButton.addEventListener("click", function () {

      const isOpen =
        settingsPanel.classList.toggle("open");

      if (dataTools) {
        dataTools.classList.toggle("open", isOpen);
      }

    });

  }

  // =========================
  // BACKUP / RESTORE / RESET
  // =========================

  const backupButton =
    document.getElementById("backup-reminders");

  const restoreButton =
    document.getElementById("restore-reminders");

  const resetButton =
    document.getElementById("reset-reminders");

  const restoreFile =
    document.getElementById("restore-file");


  if (backupButton) {

    backupButton.addEventListener("click", function () {

      const reminders = getReminders();

      const backup = {
        app: "Reminders",
        version: 1,
        exportedAt: new Date().toISOString(),
        reminders: reminders
      };

      const blob = new Blob(
        [JSON.stringify(backup, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download =
        "reminders-backup-" +
        new Date().toISOString().slice(0, 10) +
        ".json";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

    });

  }


  if (restoreButton && restoreFile) {

    restoreButton.addEventListener("click", function () {
      restoreFile.click();
    });


    restoreFile.addEventListener("change", function () {

      const file = restoreFile.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();


      reader.onload = function (event) {

        try {

          const data =
            JSON.parse(event.target.result);

          const reminders =
            Array.isArray(data)
              ? data
              : data.reminders;


          if (!Array.isArray(reminders)) {
            throw new Error("Invalid backup format.");
          }


          const validReminders =
            reminders.filter(function (item) {

              return (
                item &&
                item.id !== undefined &&
                typeof item.title === "string" &&
                typeof item.date === "string" &&
                typeof item.time === "string" &&
                typeof item.priority === "string" &&
                Array.isArray(item.subtasks)
              );

            });


          if (validReminders.length !== reminders.length) {
            throw new Error("Backup contains invalid reminder data.");
          }


          saveReminders(validReminders);

          alert(
            "Backup restored successfully. The page will reload."
          );

          window.location.reload();

        } catch (error) {

          alert(
            "Restore failed. Please choose a valid Reminders backup file."
          );

        } finally {

          restoreFile.value = "";

        }

      };


      reader.readAsText(file);

    });

  }


  if (resetButton) {

    resetButton.addEventListener("click", function () {

      const confirmed =
        confirm(
          "Reset all saved reminders? This cannot be undone unless you have a backup."
        );


      if (!confirmed) {
        return;
      }


      localStorage.removeItem(STORAGE_KEY);

      window.location.reload();

    });

  }


  loadReminders();
</script>

<div id="toast">
  ✓ Reminder saved
</div>

</body>
</html>
